services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mineros
      POSTGRES_USER: mineros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineros -d mineros"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  datos_postgres:
